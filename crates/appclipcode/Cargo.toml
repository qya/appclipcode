[package]
name = "appclipcode"
version = "0.1.0"
edition = "2021"
description = "Pure Rust encoder and decoder for Apple App Clip Codes"
authors = ["qya"]

[features]
default = []
png = ["dep:resvg", "dep:tiny-skia"]

[dependencies]
miniz_oxide = "0.8"
resvg = { version = "0.45.1", optional = true }
tiny-skia = { version = "0.11.4", optional = true }

[dev-dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
